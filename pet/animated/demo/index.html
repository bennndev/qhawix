<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Owl mascot demo</title>
<style>
  :root { --mascot-ink: #111; --bg: #fafafa; --fg: #111; --accent: #111; }
  @media (prefers-color-scheme: dark) { :root { --mascot-ink: #f4f4f4; --bg: #151515; --fg: #f4f4f4; --accent: #f4f4f4; } }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; gap: 1rem; background: var(--bg); color: var(--fg); font: 16px/1.4 system-ui, sans-serif; }
  main { display: grid; justify-items: center; gap: 1rem; padding: 1rem; }
  #stage { width: min(80vw, 420px); aspect-ratio: 1; }
  #stage svg { width: 100%; height: 100%; overflow: visible; }
  nav { display: flex; gap: .5rem; flex-wrap: wrap; justify-content: center; }
  button { font: inherit; padding: .5rem 1rem; border: 2px solid var(--accent); border-radius: 999px; background: transparent; color: var(--fg); cursor: pointer; }
  button[aria-pressed="true"] { background: var(--accent); color: var(--bg); }
  button:focus-visible { outline: 3px solid #4a8cff; outline-offset: 2px; }
  #status { min-height: 1.4em; opacity: .7; }
</style>
</head>
<body>
<main>
  <div id="stage"></div>
  <nav aria-label="Mascot state">
    <button data-state="idle">idle</button>
    <button data-state="thinking">thinking</button>
    <button data-state="working">working</button>
    <button data-state="success">success</button>
  </nav>
  <p id="status" role="status" aria-live="polite"></p>
</main>
<script type="module">
  import { createMascot } from '../src/mascot-engine.js';
  const [spec, svg] = await Promise.all([
    fetch('../src/mascot.spec.json').then((r) => r.json()),
    fetch('../assets/mascot.svg').then((r) => r.text()),
  ]);
  document.getElementById('stage').innerHTML = svg;
  const mascot = createMascot(document.querySelector('#stage svg'), spec);
  const buttons = [...document.querySelectorAll('button[data-state]')];
  const status = document.getElementById('status');
  mascot.on((_, { to }) => {
    buttons.forEach((b) => b.setAttribute('aria-pressed', String(b.dataset.state === to)));
    status.textContent = `State: ${to}`;
  });
  buttons.forEach((b) => b.addEventListener('click', () => mascot.setState(b.dataset.state)));
  buttons[0].setAttribute('aria-pressed', 'true');
  window.mascot = mascot; // handy from the console
</script>
</body>
</html>
